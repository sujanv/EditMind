# Mass-Editing Memory in a Transformer (MEMIT) Configuration
method: "memit"

layers: [2, 3, 4]        # Layers across which the residual update is distributed
v_num_grad_steps: 20
v_lr: 0.1
v_weight_decay: 0.1
clamp_norm_factor: 4.0
rewrite_module_tmp: "layers.{}.mlp.down_proj"

stats:
  mom2_dataset: "wikipedia"
  sample_size: 200
  precision: "float32"
